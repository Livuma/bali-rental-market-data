name: Update market data

on:
  schedule:
    # Livuma captures a new period on the 2nd of each month; pull it on the 4th, 03:00 UTC.
    - cron: "0 3 4 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch latest market stats
        run: python scripts/fetch_market_stats.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          period=$(python -c "import glob,os;print(os.path.splitext(os.path.basename(sorted(glob.glob('data/snapshots/*.json'))[-1]))[0])")
          git commit -m "data: add market stats for ${period}"
          git push
